<!-- 1. Top Information Bar -->
<div class="bg-burgundy text-white py-2 px-6 border-b border-[#3a0715]">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2 text-xs font-medium tracking-wide">
        <!-- Date and Publication -->
        <div class="flex items-center gap-3">
            <span class="flex items-center gap-1.5">
                <i class="fa-regular fa-calendar"></i> 
                <span id="currentDate">Oct 15, 2026</span>
            </span>
            <span class="text-white/30">|</span>
            <span class="flex items-center gap-1.5">
                <i class="fa-regular"></i>Polytechnic University of the Philippines - Biñan Campus
            </span>
        </div>

        <!-- Socials and Login -->
        <div class="flex items-center gap-4">
            <a href="login.html" class="border border-white/50 rounded-full px-4 py-1.5 flex items-center gap-2 hover:bg-white/10 transition hidden sm:flex">
                <i class="fa-regular fa-user"></i> Login as Member
            </a>
        </div>
    </div>
</div>

<!-- 2. Logo and Search Bar -->
<div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between gap-8">
    <!-- Round Logo -->
    <a href="#home" class="flex items-center gap-3 shrink-0">
        <img src="images/logo.jpg" alt="The Lens Logo" class="w-14 h-14 object-cover rounded-full border-2 border-wine shadow-sm">
        <div>
            <h1 class="text-3xl md:text-4xl font-extrabold font-display text-wine tracking-tight">
                THE LENS
            </h1>
            <p class="text-[10px] tracking-[0.2em] font-bold text-wine/80 uppercase mt-0.5">
                Basta Lente, Abante!
            </p>
        </div>
    </a>

    <!-- Search Bar with Automatic Sort & Filter Dropdown -->
    <div class="flex-1 max-w-2xl hidden md:block relative">
        <form id="searchForm" class="flex items-center border border-stone-300 rounded-full px-4 py-2 bg-stone-50/50 focus-within:border-wine focus-within:bg-white transition-all shadow-sm hover:shadow-md">
            <i class="fa-solid fa-magnifying-glass text-stone-400 text-sm"></i>
            <input
                type="search"
                id="searchInput"
                class="flex-1 border-none outline-none bg-transparent px-3 text-sm text-stone-700 placeholder-stone-400"
                placeholder="Search articles, topics, or keywords..."
                aria-label="Search articles"
            >
            <div class="h-5 w-[1px] bg-stone-300 mx-2"></div>
            <button type="button" id="sortFilterBtn" class="flex items-center gap-2 text-sm text-stone-600 hover:text-wine whitespace-nowrap font-medium px-1">
                <i class="fa-solid fa-sliders"></i> Sort & Filter <i class="fa-solid fa-chevron-down text-[10px] ml-1"></i>
            </button>
        </form>

        <!-- Automatic Sort & Filter Menu -->
        <div id="filterDropdown" class="hidden absolute right-0 mt-2 w-72 bg-white rounded-xl shadow-xl border border-stone-200 p-4 z-50 text-sm text-stone-700">
            <div class="font-bold text-wine pb-2 border-b border-stone-100 flex justify-between items-center">
                <span>Sort & Filter Options</span>
                <button type="button" id="closeFilterBtn" class="text-stone-400 hover:text-stone-600 text-xs">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="mt-3 space-y-3">
                <div>
                    <label for="sortSelect" class="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1">Sort By</label>
                    <select id="sortSelect" class="w-full bg-stone-50 border border-stone-200 rounded-lg px-3 py-2 text-stone-800 text-xs focus:outline-none focus:border-wine cursor-pointer">
                        <option value="newest">Newest First</option>
                        <option value="oldest">Oldest First</option>
                        <option value="popular">Most Popular (Views)</option>
                    </select>
                </div>

                <div>
                    <label for="categorySelect" class="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1">Category</label>
                    <select id="categorySelect" class="w-full bg-stone-50 border border-stone-200 rounded-lg px-3 py-2 text-stone-800 text-xs focus:outline-none focus:border-wine cursor-pointer">
                        <option value="All">All Categories</option>
                        <option value="News">News</option>
                        <option value="Features">Features</option>
                        <option value="Opinion">Opinion</option>
                        <option value="Science and Technology">Science & Technology</option>
                        <option value="Literature">Literature</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- Quick Links -->
    <div class="hidden lg:flex items-center gap-5 text-sm font-medium text-stone-700 shrink-0">
        <a href="#about" class="flex items-center gap-2 hover:text-wine transition"><i class="fa-regular fa-user"></i> About Us</a>
        <span class="text-stone-300">|</span>
        <a href="#contact" class="flex items-center gap-2 hover:text-wine transition"><i class="fa-regular fa-envelope"></i> Contact Us</a>
    </div>

    <!-- Mobile Navigation Button -->
    <button id="menuButton" class="md:hidden text-wine text-2xl" aria-label="Toggle navigation">
        <i class="fa-solid fa-bars"></i>
    </button>
</div>
