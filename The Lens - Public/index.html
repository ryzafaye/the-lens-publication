<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Lens Publication</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Tailwind custom colors and fonts -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        wine: "#700f2b",
                        burgundy: "#4a091b",
                        darkbrown: "#4a091b"
                    },
                    fontFamily: {
                        display: ['Playfair Display', 'serif'],
                        body: ['DM Sans', 'sans-serif']
                    }
                }
            }
        };
    </script>
</head>

<body class="bg-white text-stone-900 font-body">

    <!-- ================= DYNAMIC HEADER CONTAINER ================= -->
    <header id="header-container" class="w-full font-body border-b border-stone-200 shadow-sm"></header>

    <!-- ================= MAIN CONTENT ================= -->
    <main id="home" class="max-w-7xl mx-auto px-6 py-8">

        <!-- Search status message -->
        <p id="searchMessage" class="hidden mb-5 text-sm text-wine"></p>

        <!-- Featured article and latest releases -->
        <section class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div id="featuredArticle" class="lg:col-span-2"></div>
            <aside id="latest" class="latest-section">
                <h2 class="section-label">LATEST RELEASES</h2>
                <div id="latestArticles" class="space-y-7 mt-6"></div>
            </aside>
        </section>

        <!-- More stories -->
        <section class="mt-14" id="moreStories">
            <div class="section-heading">
                <h2>More stories</h2>
                <a href="archives.html" class="text-wine text-sm font-bold">Explore archives →</a>
            </div>
            <div id="moreArticles" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
        </section>

        <!-- News -->
        <section id="news" class="category-section">
            <div class="section-heading">
                <h2>News</h2>
                <a href="news.html" class="category-button">View all →</a>
            </div>
            <div id="newsArticles" class="category-grid"></div>
        </section>

        <!-- Features -->
        <section id="features" class="category-section">
            <div class="section-heading">
                <h2>Features</h2>
                <a href="features.html" class="category-button">View all →</a>
            </div>
            <div id="featuresArticles" class="category-grid"></div>
        </section>

        <!-- Opinion -->
        <section id="opinion" class="category-section">
            <div class="section-heading">
                <h2>Opinion</h2>
                <a href="opinion.html" class="category-button">View all →</a>
            </div>
            <div id="opinionArticles" class="category-grid"></div>
        </section>

        <!-- Science & Technology -->
        <section id="science" class="category-section">
            <div class="section-heading">
                <h2>Science & Technology</h2>
                <a href="science.html" class="category-button">View all →</a>
            </div>
            <div id="scienceArticles" class="category-grid"></div>
        </section>

        <!-- Literature -->
        <section id="literature" class="category-section">
            <div class="section-heading">
                <h2>Literature</h2>
                <a href="literature.html" class="category-button">View all →</a>
            </div>
            <div id="literatureArticles" class="category-grid"></div>
        </section>

    </main>

    <!-- ================= DYNAMIC FOOTER CONTAINER ================= -->
    <footer id="footer-container" class="site-footer"></footer>

    <!-- ================= ARTICLE DETAIL MODAL ================= -->
    <dialog id="articleModal" class="article-modal">
        <div class="modal-topbar">
            <span class="modal-topbar-brand">
                <i class="fa-solid fa-newspaper" style="margin-right:8px;"></i>The Lens
            </span>
            <button type="button" id="closeArticle" class="modal-topbar-close" aria-label="Close article">&times;</button>
        </div>
        <div id="articleDetails" class="modal-reader"></div>
    </dialog>


    <!-- ================= COMPONENT LOADER ================= -->
    <!-- This script fetches the header/footer, THEN loads your script.js -->
    <script>
        async function loadComponents() {
            try {
                // Fetch and insert Header
                const headerResponse = await fetch('header.html');
                if (headerResponse.ok) {
                    document.getElementById('header-container').innerHTML = await headerResponse.text();
                }

                // Fetch and insert Footer
                const footerResponse = await fetch('footer.html');
                if (footerResponse.ok) {
                    document.getElementById('footer-container').innerHTML = await footerResponse.text();
                }

                // IMPORTANT: Once HTML is injected, load the main script file
                // This ensures script.js can find the search bar and menu buttons
                const mainScript = document.createElement('script');
                mainScript.src = 'js/script.js';
                document.body.appendChild(mainScript);
                
            } catch (error) {
                console.error("Error loading header or footer:", error);
            }
        }

        // Initialize component loading
        loadComponents();
    </script>
</body>
</html>
