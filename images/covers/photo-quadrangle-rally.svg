<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="photoRallyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="lensAperture" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#photoRallyBg)"/>

  <!-- Camera Viewfinder Overlay -->
  <g stroke="rgba(255,255,255,0.25)" stroke-width="2" fill="none">
    <!-- Corner brackets -->
    <path d="M 40,70 L 40,40 L 70,40" />
    <path d="M 760,70 L 760,40 L 730,40" />
    <path d="M 40,430 L 40,460 L 70,460" />
    <path d="M 760,430 L 760,460 L 730,460" />
    <!-- Center focus crosshairs -->
    <circle cx="400" cy="250" r="48" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" stroke-dasharray="4,4" />
    <line x1="380" y1="250" x2="392" y2="250" stroke="#38bdf8" stroke-width="2" />
    <line x1="408" y1="250" x2="420" y2="250" stroke="#38bdf8" stroke-width="2" />
    <line x1="400" y1="230" x2="400" y2="242" stroke="#38bdf8" stroke-width="2" />
    <line x1="400" y1="258" x2="400" y2="270" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- Silhouette Crowds / Banners Graphic -->
  <g fill="rgba(255,255,255,0.06)">
    <!-- Stage / Quadrangle Steps -->
    <rect x="80" y="330" width="640" height="110" rx="6" />
    <!-- Crowd silhouettes -->
    <circle cx="160" cy="310" r="26" />
    <circle cx="210" cy="300" r="28" />
    <circle cx="265" cy="290" r="32" />
    <circle cx="330" cy="295" r="29" />
    <circle cx="400" cy="285" r="35" />
    <circle cx="470" cy="292" r="30" />
    <circle cx="535" cy="288" r="32" />
    <circle cx="595" cy="305" r="27" />
    <circle cx="645" cy="315" r="25" />
    <!-- Placards -->
    <rect x="245" y="220" width="45" height="35" rx="3" fill="rgba(56, 189, 248, 0.2)" stroke="rgba(56, 189, 248, 0.4)" />
    <line x1="267" y1="255" x2="267" y2="290" stroke="rgba(255,255,255,0.3)" stroke-width="2" />
    <rect x="515" y="210" width="55" height="40" rx="3" fill="rgba(244, 63, 94, 0.2)" stroke="rgba(244, 63, 94, 0.4)" />
    <line x1="542" y1="250" x2="542" y2="290" stroke="rgba(255,255,255,0.3)" stroke-width="2" />
  </g>

  <!-- Category & Live Capture Badge -->
  <rect x="60" y="70" width="165" height="28" rx="4" fill="url(#lensAperture)"/>
  <text x="142" y="89" fill="#0c4a6e" font-family="'DM Sans', sans-serif" font-weight="800" font-size="12" text-anchor="middle" letter-spacing="1">PHOTOJOURNALISM</text>

  <!-- Lens Metadata Badge -->
  <g transform="translate(560, 70)">
    <rect width="180" height="28" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#22c55e" />
    <text x="28" y="19" fill="#e2e8f0" font-family="'DM Sans', monospace" font-size="11" font-weight="600">50mm • ƒ/1.8 • 1/500s</text>
  </g>

  <!-- Headline -->
  <text x="60" y="150" fill="#ffffff" font-family="'Playfair Display', serif" font-weight="800" font-size="32">CAMPUS SOLIDARITY RALLY</text>
  <text x="60" y="185" fill="rgba(255,255,255,0.85)" font-family="'DM Sans', sans-serif" font-size="16">Students Convene at Main Quadrangle to Demand Laboratory Equipment Parity</text>

  <!-- Photojournalist Byline Box -->
  <rect x="60" y="380" width="340" height="50" rx="8" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
  <text x="80" y="402" fill="rgba(255,255,255,0.6)" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600">PHOTOJOURNALIST BYLINE</text>
  <text x="80" y="420" fill="#38bdf8" font-family="'DM Sans', sans-serif" font-size="14" font-weight="700">Carlo Ramos • Staff Photographer</text>

  <!-- Footer Branding -->
  <text x="60" y="465" fill="rgba(255,255,255,0.4)" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600">THE LENS PUBLICATION • PHOTO DESK ARCHIVE</text>
</svg>

