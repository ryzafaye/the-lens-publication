<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Lens Publication</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Tailwind custom colors and fonts -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        wine: "#700f2b",
                        burgundy: "#4a091b",
                        darkbrown: "#4a091b"
                    },
                    fontFamily: {
                        display: ['Playfair Display', 'serif'],
                        body: ['DM Sans', 'sans-serif']
                    }
                }
            }
        };
    </script>
</head>

<body class="bg-white text-stone-900 font-body">

    <!-- ================= DYNAMIC HEADER CONTAINER ================= -->
    <header id="header-container" class="w-full font-body border-b border-stone-200 shadow-sm"></header>

    <!-- ================= MAIN CONTENT ================= -->
    <main class="max-w-7xl mx-auto px-6 py-10">

        <!-- Page introduction -->
        <section class="mb-9">
            <p class="text-xs tracking-widest text-wine font-bold mb-3">
                THE LENS COLLECTION
            </p>

            <h2 class="font-display text-4xl md:text-5xl font-extrabold text-wine">
                Article Archives
            </h2>

            <p class="mt-4 text-stone-600 max-w-2xl leading-relaxed">
                Explore previously published stories from The Lens.
                Browse by section or search for a particular topic, author, or article.
            </p>
        </section>

        <!-- Search result message -->
        <p id="searchMessage"
           class="hidden mb-5 text-sm text-wine"
           aria-live="polite"></p>

        <!-- Category filter -->
        <section class="border-t-2 border-wine pt-5">

            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">

                <h3 class="font-display text-2xl font-bold">
                    Browse all stories
                </h3>

                <label class="flex items-center gap-3 text-sm">
                    <span>Category:</span>

                    <select id="archiveFilter" class="archive-select">
                        <option value="All">All categories</option>
                        <option value="News">News</option>
                        <option value="Features">Features</option>
                        <option value="Opinion">Opinion</option>
                        <option value="Science and Technology">Science & Technology</option>
                        <option value="Literature">Literature</option>
                    </select>
                </label>

            </div>

            <!-- JavaScript inserts the archived articles here -->
            <div id="archiveArticles"
                 class="grid grid-cols-1 md:grid-cols-2 gap-x-8">
            </div>

            <p id="archiveCount"
               class="mt-6 text-xs text-stone-500"></p>

        </section>

        <!-- Return to homepage -->
        <div class="mt-12">
            <a href="index.html"
               class="inline-block border border-wine px-5 py-3 text-wine text-sm font-bold rounded hover:bg-rose-50">
                ← Back to Homepage
            </a>
        </div>

    </main>

    <!-- ================= DYNAMIC FOOTER CONTAINER ================= -->
    <footer id="footer-container" class="site-footer"></footer>

    <!-- ================= ARTICLE DETAIL MODAL ================= -->
    <dialog id="articleModal" class="article-modal">
        <button id="closeArticle" class="close-modal" aria-label="Close article">×</button>
        <div id="articleDetails"></div>
    </dialog>


    <!-- ================= COMPONENT LOADER ================= -->
    <!-- This script fetches the header/footer, highlights the active link, THEN loads script.js -->
    <script>
        async function loadComponents() {
            try {
                // 1. Fetch and insert Header
                const headerResponse = await fetch('header.html');
                if (headerResponse.ok) {
                    document.getElementById('header-container').innerHTML = await headerResponse.text();
                }

                // 2. Fetch and insert Footer
                const footerResponse = await fetch('footer.html');
                if (footerResponse.ok) {
                    document.getElementById('footer-container').innerHTML = await footerResponse.text();
                }

                // 3. Highlight the correct active link dynamically
                setActiveLink();

                // 4. IMPORTANT: Load the main script.js only AFTER HTML is injected
                const mainScript = document.createElement('script');
                mainScript.src = 'js/script.js';
                document.body.appendChild(mainScript);
                
            } catch (error) {
                console.error("Error loading header or footer:", error);
            }
        }

        // Function to detect current page and update navigation styles
        function setActiveLink() {
            // Get the current file name (e.g., "news.html")
            let path = window.location.pathname;
            let page = path.split("/").pop();
            
            // If the URL is just the root folder (e.g., localhost:5500/), default to index.html
            if (page === "" || page === "/") {
                page = "index.html";
            }

            // Find all links inside the newly injected navigation menu
            const navLinks = document.querySelectorAll('#navigation a');
            
            navLinks.forEach(link => {
                const href = link.getAttribute('href');
                
                // If the link's destination matches the current page
                if (href === page) {
                    // Add active styling (White border & text)
                    link.classList.remove('border-transparent', 'text-white/90');
                    link.classList.add('border-white', 'text-white', 'active');
                } else {
                    // Ensure non-active styling (Transparent border & slightly faded text)
                    link.classList.remove('border-white', 'text-white', 'active');
                    link.classList.add('border-transparent', 'text-white/90');
                }
            });
        }

        // Initialize the loader
        loadComponents();
    </script>
</body>
</html>
