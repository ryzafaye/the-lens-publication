<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cartoonPaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <!-- Background Paper Texture -->
  <rect width="800" height="500" fill="url(#cartoonPaper)"/>
  
  <!-- Inking Border -->
  <rect x="25" y="25" width="750" height="450" fill="none" stroke="#1f2937" stroke-width="4" stroke-dasharray="800" rx="6"/>

  <!-- Badge -->
  <rect x="50" y="50" width="165" height="28" rx="4" fill="#991b1b"/>
  <text x="132" y="69" fill="#ffffff" font-family="'DM Sans', sans-serif" font-weight="800" font-size="12" text-anchor="middle" letter-spacing="1">EDITORIAL CARTOON</text>

  <text x="50" y="115" fill="#111827" font-family="'Playfair Display', serif" font-weight="800" font-size="28">THE UNBROKEN NIB</text>
  <text x="50" y="140" fill="#4b5563" font-family="'DM Sans', sans-serif" font-size="15">Subject: Student Publication Independence vs. Administrative 'Brand Alignment'</text>

  <!-- Illustration Elements: Giant Pen Nib breaking chains -->
  <g transform="translate(180, 160)">
    <!-- Giant Pen Nib -->
    <path d="M 220,20 L 260,110 L 245,230 L 195,230 L 180,110 Z" fill="#111827" stroke="#000000" stroke-width="3"/>
    <path d="M 220,20 L 220,130" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="220" cy="130" r="7" fill="#fbbf24"/>
    
    <!-- Broken Chain Links around the pen -->
    <path d="M 140,140 Q 170,110 200,150" fill="none" stroke="#71717a" stroke-width="8" stroke-linecap="round"/>
    <path d="M 240,150 Q 270,110 300,140" fill="none" stroke="#71717a" stroke-width="8" stroke-linecap="round"/>
    <!-- Shattered links flying -->
    <rect x="110" y="90" width="16" height="24" rx="4" fill="#71717a" transform="rotate(-25 110 90)"/>
    <rect x="320" y="80" width="16" height="24" rx="4" fill="#71717a" transform="rotate(35 320 80)"/>
    
    <!-- Impact lines -->
    <line x1="220" y1="10" x2="220" y2="-15" stroke="#dc2626" stroke-width="3"/>
    <line x1="200" y1="15" x2="180" y2="-5" stroke="#dc2626" stroke-width="3"/>
    <line x1="240" y1="15" x2="260" y2="-5" stroke="#dc2626" stroke-width="3"/>

    <!-- Speech / Label Stamp -->
    <g transform="translate(60, 180)">
      <rect width="130" height="30" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
      <text x="65" y="20" fill="#991b1b" font-family="'DM Sans', sans-serif" font-weight="700" font-size="12" text-anchor="middle">PRIOR REVIEW</text>
    </g>

    <g transform="translate(260, 180)">
      <rect width="130" height="30" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
      <text x="65" y="20" fill="#15803d" font-family="'DM Sans', sans-serif" font-weight="700" font-size="12" text-anchor="middle">CAMPUS PRESS</text>
    </g>
  </g>

  <!-- Artist Signature in bottom right -->
  <text x="730" y="445" fill="#111827" font-family="'Playfair Display', serif" font-weight="700" font-style="italic" font-size="14" text-anchor="end">D. Reyes '26</text>
  <text x="50" y="445" fill="#6b7280" font-family="'DM Sans', sans-serif" font-size="12">THE LENS PUBLICATION • OPINION DESK</text>
</svg>
