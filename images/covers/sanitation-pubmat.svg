<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="nightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#nightBg)"/>

  <!-- Halo / Night Glow -->
  <circle cx="650" cy="220" r="170" fill="rgba(245,158,11,0.08)"/>
  
  <!-- Category Badge -->
  <rect x="60" y="70" width="125" height="28" rx="4" fill="url(#amberGold)"/>
  <text x="122" y="89" fill="#18181b" font-family="'DM Sans', sans-serif" font-weight="800" font-size="12" text-anchor="middle" letter-spacing="1">FEATURE SPREAD</text>

  <text x="60" y="150" fill="#ffffff" font-family="'Playfair Display', serif" font-weight="800" font-size="34">THE MIDNIGHT KEEPERS</text>
  <text x="60" y="190" fill="rgba(255,255,255,0.8)" font-family="'DM Sans', sans-serif" font-size="17">A 24-Hour Glimpse into the Silent Night Shift of Campus Sanitation Workers</text>

  <!-- Quote Card Container -->
  <rect x="60" y="235" width="680" height="160" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <text x="90" y="275" fill="#f59e0b" font-family="'Playfair Display', serif" font-weight="700" font-size="32">“</text>
  <text x="110" y="295" fill="#f4f4f5" font-family="'Playfair Display', serif" font-style="italic" font-size="18">We keep the school standing, even if our names are never spoken during graduation.</text>
  <text x="110" y="335" fill="rgba(255,255,255,0.6)" font-family="'DM Sans', sans-serif" font-size="13">— Mang Rodrigo, Custodian for 18 years • Science Pavilion</text>
  
  <g transform="translate(90, 355)">
    <rect width="180" height="24" rx="4" fill="rgba(245,158,11,0.2)"/>
    <text x="90" y="16" fill="#fbbf24" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">22 NIGHT SHIFT WORKERS</text>
  </g>

  <!-- Footer -->
  <text x="60" y="455" fill="rgba(255,255,255,0.5)" font-family="'DM Sans', sans-serif" font-size="12" font-weight="600">THE LENS • FEATURES DESK</text>
</svg>
