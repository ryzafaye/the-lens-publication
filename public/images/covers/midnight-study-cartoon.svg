<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="midnightSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#midnightSky)"/>
  
  <rect x="25" y="25" width="750" height="450" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="10,5" rx="6"/>

  <rect x="50" y="50" width="180" height="28" rx="4" fill="#312e81"/>
  <text x="140" y="69" fill="#e0e7ff" font-family="'DM Sans', sans-serif" font-weight="800" font-size="12" text-anchor="middle" letter-spacing="1">LITERARY ILLUSTRATION</text>

  <text x="50" y="115" fill="#f8fafc" font-family="'Playfair Display', serif" font-weight="800" font-size="28">VERSES FROM THE STUDY HALL</text>
  <text x="50" y="140" fill="#94a3b8" font-family="'DM Sans', sans-serif" font-size="15">Accompanying Illustration for Camille Torres' Poem 'Echoes from the Quadrangle'</text>

  <!-- Illustration: Night study lamp and open notebook with moon -->
  <g transform="translate(230, 150)">
    <!-- Crescent Moon in window -->
    <path d="M 280,30 A 45,45 0 0,0 340,90 A 35,35 0 0,1 280,30 Z" fill="#fde047" opacity="0.9"/>
    
    <!-- Stars -->
    <circle cx="240" cy="50" r="2" fill="#ffffff" opacity="0.8"/>
    <circle cx="360" cy="40" r="2.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="300" cy="110" r="2" fill="#ffffff" opacity="0.8"/>

    <!-- Desk Surface -->
    <rect x="10" y="210" width="320" height="12" rx="3" fill="#334155"/>

    <!-- Desk Lamp with warm glow cone -->
    <path d="M 60,80 L 110,80 L 125,120 L 45,120 Z" fill="#e2e8f0"/>
    <path d="M 85,120 L 50,210" stroke="#94a3b8" stroke-width="6"/>
    <circle cx="50" cy="210" r="14" fill="#64748b"/>
    <!-- Glow -->
    <polygon points="45,120 125,120 220,210 20,210" fill="rgba(254,240,138,0.18)"/>

    <!-- Open Poetry Notebook -->
    <g transform="translate(90, 165)">
      <polygon points="10,35 60,30 60,48 10,48" fill="#f8fafc"/>
      <polygon points="60,30 110,35 110,48 60,48" fill="#f1f5f9"/>
      <line x1="20" y1="36" x2="50" y2="34" stroke="#475569" stroke-width="1.5"/>
      <line x1="20" y1="41" x2="50" y2="39" stroke="#475569" stroke-width="1.5"/>
      <line x1="70" y1="34" x2="100" y2="36" stroke="#475569" stroke-width="1.5"/>
      <line x1="70" y1="39" x2="100" y2="41" stroke="#475569" stroke-width="1.5"/>
      <!-- Steaming mug -->
      <rect x="125" y="18" width="18" height="24" rx="2" fill="#f8fafc"/>
      <path d="M 143,24 Q 150,28 143,34" fill="none" stroke="#f8fafc" stroke-width="2"/>
    </g>
  </g>

  <text x="730" y="445" fill="#f8fafc" font-family="'Playfair Display', serif" font-weight="700" font-style="italic" font-size="14" text-anchor="end">Carlo Santos '26</text>
  <text x="50" y="445" fill="#94a3b8" font-family="'DM Sans', sans-serif" font-size="12">THE LENS PUBLICATION • LITERATURE DESK</text>
</svg>
