<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write Article | The Lens Executive Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { wine: "#700f2b", burgundy: "#3b0514" } } }
        };
    </script>
</head>
<body class="bg-[#fcfbfb] text-stone-900 font-body">
    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-[#3b0514] text-white flex flex-col justify-between fixed top-0 left-0 h-screen z-50 p-6 overflow-y-auto">
            <div>
               <!-- Prominent Sidebar Branding Header -->
                    <div class="mb-8 pb-4 border-b border-white/10">
                        <a href="admin-dashboard.html" class="flex items-center gap-3.5">
                            <img src="images/logo.jpg" alt="The Lens Logo" class="w-14 h-14 object-cover rounded-full border-2 border-rose-200/40 shadow-md shrink-0">
                            <div>
                                <h1 class="font-display text-2xl font-black tracking-tight text-white leading-none">The Lens</h1>
                                <p class="text-[11px] tracking-[0.18em] text-rose-200/80 font-bold uppercase mt-1.5">Executive Portal</p>
                            </div>
                        </a>
                    </div>
                    
                <nav class="space-y-1 text-sm font-medium">
                    <a href="admin-dashboard.html" class="block px-3 py-2.5 rounded-lg text-rose-100/80 hover:bg-[#4e091c] hover:text-white transition">Dashboard and analytics</a>
                    <a href="admin-articles.html" class="block px-3 py-2.5 rounded-lg text-rose-100/80 hover:bg-[#4e091c] hover:text-white transition">Articles</a>
                    <a href="admin-write.html" class="flex items-center justify-between px-3 py-2.5 rounded-lg bg-[#550c20] text-white font-semibold">Submit article</a>
                    <a href="admin-accounts.html" class="block px-3 py-2.5 rounded-lg text-rose-100/80 hover:bg-[#4e091c] hover:text-white transition">Accounts</a>
                    <a href="admin-logs.html" class="block px-3 py-2.5 rounded-lg text-rose-100/80 hover:bg-[#4e091c] hover:text-white transition">Activity log</a>
                    <a href="admin-transparency.html" class="block px-3 py-2.5 rounded-lg text-rose-100/80 hover:bg-[#4e091c] hover:text-white transition">Transparency</a>
                </nav>
            </div>
            <div class="pt-6"><a href="index.html" class="block w-full border border-white/20 hover:bg-white/10 text-white text-xs font-medium py-2 rounded-lg text-center">View public site</a></div>
        </aside>

        <!-- Main Content -->
        <main class="ml-64 flex-1 p-10 max-w-4xl">
            <div class="mb-8">
                <h1 class="font-display text-3xl font-extrabold text-stone-900">Write / Submit Article</h1>
                <p class="text-sm text-stone-500 mt-1">Create a new publication draft for review or direct publishing.</p>
            </div>

            <form class="bg-white border border-stone-200 rounded-xl p-8 space-y-6 shadow-sm">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-stone-600 mb-2">Article Title</label>
                    <input type="text" class="w-full border border-stone-300 rounded-lg p-3 text-sm focus:outline-none focus:border-wine" placeholder="Enter title...">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-stone-600 mb-2">Section Category</label>
                        <select class="w-full border border-stone-300 rounded-lg p-3 text-sm bg-white focus:outline-none focus:border-wine">
                            <option>News</option>
                            <option>Features</option>
                            <option>Opinion</option>
                            <option>Science & Technology</option>
                            <option>Literature</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-stone-600 mb-2">Author Name</label>
                        <input type="text" class="w-full border border-stone-300 rounded-lg p-3 text-sm focus:outline-none focus:border-wine" placeholder="Author name...">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-stone-600 mb-2">Article Content</label>
                    <textarea rows="8" class="w-full border border-stone-300 rounded-lg p-3 text-sm focus:outline-none focus:border-wine" placeholder="Write your full article text here..."></textarea>
                </div>
                <div class="flex justify-end gap-4 pt-4 border-t border-stone-100">
                    <button type="button" class="px-5 py-2.5 border border-stone-300 rounded-lg text-xs font-bold text-stone-600 hover:bg-stone-50">Save Draft</button>
                    <button type="submit" class="px-5 py-2.5 bg-wine text-white rounded-lg text-xs font-bold hover:bg-burgundy">Submit for Review</button>
                </div>
            </form>
        </main>
    </div>
</body>
</html>
